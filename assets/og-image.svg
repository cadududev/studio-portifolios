<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1310"/>
      <stop offset="100%" stop-color="#2a1e18"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2562f"/>
      <stop offset="100%" stop-color="#e9a04b"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#e9a04b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e9a04b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(90, 120)">
    <rect width="72" height="72" rx="18" fill="url(#brand)"/>
    <text x="96" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#f5eee6" letter-spacing="0.5">
      Studio<tspan font-weight="800">Portfólios</tspan>
    </text>
  </g>

  <text x="90" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="#f5eee6" letter-spacing="-1">
    5 modelos criativos
  </text>
  <text x="90" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="url(#brand)" letter-spacing="-1">
    de portfólio
  </text>

  <text x="90" y="490" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#c9beb2">
    Advogados · Nutricionistas · Marketing · Fotógrafos · Designers
  </text>

  <g transform="translate(90, 540)">
    <rect width="220" height="52" rx="26" fill="url(#brand)"/>
    <text x="110" y="34" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1310" text-anchor="middle">
      Montar o meu →
    </text>
  </g>

  <g transform="translate(1050, 545)" opacity="0.5">
    <text x="0" y="30" font-family="'Consolas', 'Courier New', monospace" font-size="20" fill="#e9a04b" text-anchor="end">
      &lt;/&gt; cadu.js
    </text>
  </g>
</svg>
